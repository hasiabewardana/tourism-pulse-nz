services: # Service definitions for Tourism Pulse NZ
  auth-service: # Authentication Service
    build: # Define the build context and Dockerfile for the Authentication Service
      context: ./backend/auth-service
      dockerfile: Dockerfile
    image: auth-service:latest # Define the image name for the Authentication Service
    ports: # Expose the Authentication Service on port 3001
      - "3001:3001"
    container_name: auth # Set a custom container name for the Authentication Service
    networks: # Use a custom network for the Authentication Service
      - tourism-pulse-nz-network

  destination-service: # Destination Service
    build: # Define the build context and Dockerfile for the Destination Service
      context: ./backend/destination-service
      dockerfile: Dockerfile
    image: destination-service:latest # Define the image name for the Destination Service
    ports: # Expose the Destination Service on port 3002
      - "3002:3002"
    container_name: destination # Set a custom container name for the Destination Service
    networks: # Use a custom network for the Destination Service
      - tourism-pulse-nz-network

  analytics-service: # Analytics Service
    build: # Define the build context and Dockerfile for the Analytics Service
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    image: analytics-service:latest # Define the image name for the Analytics Service
    ports: # Expose the Analytics Service on port 3003
      - "3003:3003"
    container_name: analytics # Set a custom container name for the Analytics Service
    networks: # Use a custom network for the Analytics Service
      - tourism-pulse-nz-network

  integration-service: # Integration Service
    build: # Define the build context and Dockerfile for the Analytics Service
      context: ./backend/integration-service
      dockerfile: Dockerfile
    image: integration-service:latest # Define the image name for the Integration Service
    ports: # Expose the Integration Service on port 3004
      - "3004:3004"
    container_name: integration # Set a custom container name for the Integration Service
    environment:
      - PORT=3004
      - NODE_ENV=production
      - EMAIL_SERVICE=${EMAIL_SERVICE:-gmail}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-tourism.pulse.nz@gmail.com}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
      - STATSNZ_API_KEY=${STATSNZ_API_KEY}
    networks: # Use a custom network for the Integration Service
      - tourism-pulse-nz-network

  payment-service: # Payment Service (Stripe Integration)
    build: # Define the build context and Dockerfile for the Payment Service
      context: ./backend/payment-service
      dockerfile: Dockerfile
    image: payment-service:latest # Define the image name for the Payment Service
    ports: # Expose the Payment Service on port 3005
      - "3005:3005"
    container_name: payment # Set a custom container name for the Payment Service
    environment:
      - PORT=3005
      - NODE_ENV=production
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-tourism_pulse}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - DEFAULT_CURRENCY=nzd
      - FRONTEND_URL=http://localhost:8080
      - API_GATEWAY_URL=http://gateway:3000
    networks: # Use a custom network for the Payment Service
      - tourism-pulse-nz-network

  api-gateway: # API Gateway Service
    build: # Define the build context and Dockerfile for the API Gateway
      context: ./api-gateway
      dockerfile: Dockerfile
    image: api-gateway:latest # Define the image name for the API Gateway
    ports: # Expose the API Gateway on port 3000
      - "3000:3000"
    container_name: gateway # Set a custom container name for the API Gateway
    depends_on: # Define dependencies for the API Gateway
      - auth-service
      - destination-service
      - analytics-service
      - integration-service
      - payment-service
    networks: # Use a custom network for the API Gateway
      - tourism-pulse-nz-network

  frontend: # Frontend Service
    build: # Define the build context and Dockerfile for the frontend
      context: ./frontend
      dockerfile: Dockerfile
    image: frontend:latest # Define the image name for the frontend
    ports: # Expose the frontend on port 3006
      - "3006:3006"
    container_name: frontend # Set a custom container name for the frontend
    environment:
      - PORT=3006
    networks: # Use a custom network for the frontend
      - tourism-pulse-nz-network
    volumes:
      - ./frontend/public/images:/app/public/images # Mount a volume for images

networks: # Define custom networks for the services
  tourism-pulse-nz-network: # Custom network for the Tourism Pulse NZ services
    driver: bridge # Define a custom bridge network for the services
